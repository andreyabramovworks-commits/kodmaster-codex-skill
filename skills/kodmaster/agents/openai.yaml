  default_prompt: "Используй $kodmaster. Пойми намерение, выбери Fast, Adaptive или Deep, затем обязательно запусти Rule Router и прочитай все применимые rule packs. Экономь контекст только после полноты правил. Для аудита используй /kodaudit, для UI /uiaudit, для передачи согласованной задачи Codex /kodsend."

policy:
